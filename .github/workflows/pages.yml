name: Deploy GLASS VEIL

on:
  push:
    branches: [main]
    paths:
      - "**"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  ATLAS_DIRECTORY: .

concurrency:
  group: glass-veil-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install website development tools
        run: npm ci --prefix "$ATLAS_DIRECTORY" --ignore-scripts --workspaces=false --no-audit --no-fund
      - name: Check and build the website
        run: |
          npm run format:check --prefix "$ATLAS_DIRECTORY"
          npm run build --prefix "$ATLAS_DIRECTORY"
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload website files only
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ env.ATLAS_DIRECTORY }}/.pages

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
